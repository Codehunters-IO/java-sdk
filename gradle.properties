org.gradle.daemon = false
# Gradle's 512 MiB default runs out of heap while dependency-check downloads the NVD database.
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Versions live in gradle/libs.versions.toml.

repository.url=https://github.com/Codehunters-IO/java-sdk
github_packages_url=https://maven.pkg.github.com/Codehunters-IO/java-sdk
