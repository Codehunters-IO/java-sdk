# Default details for the client-input codes other SDK modules throw. An application's own
# error.<CODE> message wins over these. Same as the base bundle: without an _en file, an English
# request on a JVM whose default locale has a bundle (e.g. es) would fall back to that bundle.
error.INVALID_SORT=The requested sort is not allowed.
error.INVALID_SEARCH=The search criteria are not valid.
error.BARCODE_IMAGE_REJECTED=The image could not be read as a barcode.
error.BARCODE_CONTENT_REJECTED=The barcode content is not valid.
