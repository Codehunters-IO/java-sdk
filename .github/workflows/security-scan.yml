name: Security scan

# OWASP dependency check of every module, on demand only: run it before a release. A run without a
# cached NVD database downloads it whole, which took two hours when the NVD API was slow, so a
# weekly schedule mostly spent runner time.
on:
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: false

permissions: {}

jobs:
  owasp:
    permissions:
      contents: read
      packages: read
    uses: Codehunters-IO/ci-templates/.github/workflows/java-owasp.yml@v2
    with:
      owasp_fail_on_cvss: 7
      # A run with no cached NVD database downloads it whole: two hours when the NVD API is slow.
      timeout_minutes: 180
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
