name: Publish

# Uploads one module to GitHub Packages when its release is published. Releases are drafted by
# release-drafts.yml on every merge to master; publishing a draft creates its tag
# (`sdk-<module>/vX.Y.Z` or `bom/vX.Y.Z`) and starts this workflow. Run it by hand with the tag to
# retry a failed upload: versions already in GitHub Packages are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. sdk-web/v1.0.0 or bom/v1.2.0'
        required: true
        type: string

# One publish at a time: uploads of the same version would race (409), and a BOM must find the
# libraries it lists already uploaded. The group holds one pending run, so publish releases one by
# one, waiting for each run.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: Codehunters-IO/ci-templates/.github/workflows/java-library-publish.yml@feature/java-library-workflows
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      tag_pattern: '^(sdk-[a-z0-9-]+|bom)/v[0-9]+\.[0-9]+\.[0-9]+$'
      verify_script: .github/scripts/verify-bom-release.sh
      docker_images: |
        testcontainers/ryuk:0.14.0
        postgres:17-alpine
        imresamu/postgis:17-3.5-alpine
        rabbitmq:4.1-alpine
        apache/kafka:4.1.1
