name: Publish to Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and publish all modules
        env:
          GH_PACKAGES_USERNAME: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build publish

      # Runs only after a successful publish. A version is published once (the build skips versions
      # already in GitHub Packages), so a tag that doesn't exist yet marks its first publication.
      # Existing tags are left alone, which makes reruns safe.
      - name: Tag released modules
        run: |
          git fetch --tags --force
          ./gradlew releaseTag --quiet | while read -r tag; do
            [ -z "$tag" ] && continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "skip $tag (exists)"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
              echo "tagged $tag"
            fi
          done
