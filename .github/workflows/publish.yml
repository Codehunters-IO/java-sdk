name: Publish to Main

on:
  push:
    branches:
      - master
      - main

# One publish at a time: overlapping runs would race on the upload (409) and on the tags.
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # The build runs tests, containers and third-party plugins: it gets no write access to the repo.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and publish all modules
        env:
          GH_PACKAGES_USERNAME: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build publish

      # Each module uploaded by this run wrote build/released-tags/<module>.txt. Kept even when a later
      # module failed, so what did reach GitHub Packages still gets its tag. The marker makes the
      # artifact exist when nothing was released.
      - name: Keep the released tags
        if: ${{ !cancelled() }}
        run: mkdir -p build/released-tags && touch build/released-tags/run.marker

      - name: Upload the released tags
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: released-tags
          path: build/released-tags/

  tag:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch the released tags
        uses: actions/download-artifact@v4
        with:
          name: released-tags
          path: released-tags

      # Tags only what this run uploaded, at the commit that built it. A tag that already exists, or
      # that a concurrent run pushed first, is left alone.
      - name: Tag released modules
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in released-tags/*.txt; do
            tag="$(tr -d '\r\n' < "$file")"
            if [[ ! "$tag" =~ ^(sdk-[a-z0-9-]+|bom)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$file holds an invalid tag name"
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "skip $tag (exists)"
              continue
            fi
            git tag "$tag" "$GITHUB_SHA"
            if git push origin "refs/tags/$tag"; then
              echo "tagged $tag"
            elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "skip $tag (pushed concurrently)"
            else
              exit 1
            fi
          done
