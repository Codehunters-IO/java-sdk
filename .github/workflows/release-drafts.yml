name: Release drafts

# Merging to master publishes nothing. This workflow builds the merge and drafts one GitHub release
# per module version that has no tag yet (`sdk-<module>/vX.Y.Z`, `bom/vX.Y.Z`). A person reviews a
# draft and publishes it; that creates the tag and runs publish.yml for that module only.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Runs queue: the newer merge is the one whose commit the drafts end up pointing at.
concurrency:
  group: release-drafts
  cancel-in-progress: false

permissions: {}

jobs:
  drafts:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
      packages: read
    uses: Codehunters-IO/ci-templates/.github/workflows/java-library-release-drafts.yml@v2
    with:
      tag_pattern: '^(sdk-[a-z0-9-]+|bom)/v[0-9]+\.[0-9]+\.[0-9]+$'
      maven_group: io.codehunters
      docker_images: |
        testcontainers/ryuk:0.14.0
        postgres:17-alpine
        imresamu/postgis:17-3.5-alpine
        rabbitmq:4.1-alpine
        apache/kafka:4.1.1
