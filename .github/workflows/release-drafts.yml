name: Release drafts

# Merging to master publishes nothing. This workflow builds the merge and drafts one GitHub release
# per module version that has no tag yet (`sdk-<module>/vX.Y.Z`, `bom/vX.Y.Z`). A person reviews a
# draft and publishes it; that creates the tag and runs publish.yml for that module only.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Runs queue: the newer merge is the one whose commit the drafts end up pointing at.
concurrency:
  group: release-drafts
  cancel-in-progress: false

permissions: {}

jobs:
  candidates:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # The build runs tests, containers and third-party plugins: it gets no write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # A draft only appears for a commit that builds.
      - name: Build and list release candidates
        run: |
          ./gradlew build releaseCandidate
          mkdir -p build/release-candidates
          cat build/release-candidates/*.txt > release-candidates.txt 2>/dev/null || true
          cat release-candidates.txt

      - name: Upload the release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-candidates
          path: release-candidates.txt
          if-no-files-found: error

  drafts:
    needs: candidates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch the release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-candidates

      - name: Draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-drafts.sh release-candidates.txt
