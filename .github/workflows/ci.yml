name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
      - develop

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Build (compile + Spotless), then `check` in the test job: every module's tests, coverage
  # rules and convention checks gate the change. No artifact, deploy or release runs here.
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    # java-main-pipeline declares these for its deploy and release jobs; a caller must grant at
    # least as much, even though java-pr-pipeline turns those jobs off.
    permissions:
      contents: write
      packages: write
      issues: write
      id-token: write
    uses: Codehunters-IO/ci-templates/.github/workflows/java-pr-pipeline.yml@feature/java-test-tasks
    with:
      run_commit_lint: ${{ github.event_name == 'pull_request' }}
      run_trufflehog: true
      run_test: true
      test_tasks: check
      # Coverage is gated per module by the build itself (90% line, 80% branch).
      run_coverage: false
      extra_gradle_commands: |
        -p build-logic test
      docker_images: |
        testcontainers/ryuk:0.14.0
        postgres:17-alpine
        imresamu/postgis:17-3.5-alpine
        rabbitmq:4.1-alpine
        apache/kafka:4.1.1
    secrets: inherit
