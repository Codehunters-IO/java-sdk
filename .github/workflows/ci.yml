name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
      - develop

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # Branch builds read the dependency cache that master builds write.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-read-only: true

      - name: Pull the integration-test images
        run: .github/scripts/pull-test-images.sh

      - name: Build, test, coverage, format check
        run: ./gradlew build

      - name: Build-logic plugin tests
        run: ./gradlew -p build-logic test

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

  secrets-scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: Codehunters-IO/ci-templates/.github/workflows/security-trufflehog.yml@v2

  commit-lint:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-commit-lint.yml@v2
