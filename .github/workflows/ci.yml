name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
      - develop

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
      packages: read
    uses: Codehunters-IO/ci-templates/.github/workflows/java-library-build.yml@feature/java-library-workflows
    with:
      gradle_commands: |
        build
        -p build-logic test
      docker_images: |
        testcontainers/ryuk:0.14.0
        postgres:17-alpine
        imresamu/postgis:17-3.5-alpine
        rabbitmq:4.1-alpine
        apache/kafka:4.1.1

  secrets-scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: Codehunters-IO/ci-templates/.github/workflows/security-trufflehog.yml@v2

  commit-lint:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: Codehunters-IO/ci-templates/.github/workflows/shared-commit-lint.yml@v2
